<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SimpleeStream</title>

    <script>
        /*
         * GitHub Pages project-site routing
         *
         * If the requested URL is:
         *
         * /simpleestream/player/lioness
         *
         * GitHub Pages serves this 404 document.
         *
         * We then redirect to player.html while
         * preserving the movie slug and query data.
         */

        const BASE_PATH = "/simpleestream/";

        const path = window.location.pathname;

        const playerPrefix =
            BASE_PATH + "player/";

        if (path.startsWith(playerPrefix)) {

            const slug =
                path.substring(playerPrefix.length);

            const query =
                window.location.search;

            const cleanQuery =
    query.startsWith("?")
        ? query.substring(1)
        : query;

const destination =
    BASE_PATH +
    "player.html?slug=" +
    encodeURIComponent(slug) +
    (cleanQuery ? "&" + cleanQuery : "");

            window.location.replace(destination);

        } else {

            window.location.replace(BASE_PATH);

        }
    </script>

</head>

<body>

    <p>Loading SimpleeStream...</p>

</body>

</html>
